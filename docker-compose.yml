services:
  db:
    image: postgres:16-alpine
    container_name: invoiceiq-db
    restart: always
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
      POSTGRES_DB: invoiceiq_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: invoiceiq-backend
    restart: always
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql+psycopg2://root:root@db:5432/invoiceiq_db
      XAI_API_KEY: ${XAI_API_KEY}
      XAI_BASE_URL: ${XAI_BASE_URL:-https://api.groq.com/openai/v1}
      XAI_MODEL: ${XAI_MODEL:-openai/gpt-oss-120b}
      UPLOAD_DIR: uploads/invoices
      MAX_UPLOAD_SIZE_MB: 15
      CORS_ORIGINS: '["http://localhost:5173", "http://localhost:3000"]'
    ports:
      - "8000:8000"
    volumes:
      - invoice_uploads:/app/uploads/invoices

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: invoiceiq-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "5173:5173"

volumes:
  postgres_data:
  invoice_uploads:
